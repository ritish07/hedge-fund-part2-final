<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quant Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDeep: '#0B120E',
                        bgSurface: '#101F18',
                        accentLime: '#75E063',
                        textPrimary: '#F1F5F2',
                        textSecondary: '#7E9489',
                        borderSage: '#1D3126',
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'Menlo', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'JetBrains Mono', monospace; background-color: #0B120E; color: #F1F5F2; overflow-x: hidden; }
        .glass-panel { background: #101F18; border: 1px solid #1D3126; }
        .glow-text { text-shadow: 0 0 10px rgba(117, 224, 99, 0.5); }
        .pulse-dot { width: 8px; height: 8px; background-color: #75E063; border-radius: 50%; box-shadow: 0 0 10px #75E063; animation: pulse 2s infinite; }
        .pulse-dot.offline { background-color: #ff6b6b; box-shadow: 0 0 10px #ff6b6b; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: auto; }
        .ui-layer { position: relative; z-index: 10; pointer-events: none; }
        .ui-panel { pointer-events: auto; }
        
        .btn-start {
            background: linear-gradient(135deg, #75E063 0%, #45A036 100%);
            color: #0B120E;
            padding: 8px 24px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(117, 224, 99, 0.3);
        }
        .btn-start:hover { box-shadow: 0 0 25px rgba(117, 224, 99, 0.6); transform: translateY(-1px); }
        
        .btn-stop {
            background: linear-gradient(135deg, #ff6b6b 0%, #c92a2a 100%);
            color: #F1F5F2;
            padding: 8px 24px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.3);
        }
        .btn-stop:hover { box-shadow: 0 0 25px rgba(255, 107, 107, 0.6); transform: translateY(-1px); }

        #tooltip {
            position: absolute;
            background: rgba(16, 31, 24, 0.95);
            border: 1px solid #1D3126;
            padding: 12px;
            border-radius: 6px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 50;
            backdrop-filter: blur(4px);
            min-width: 250px;
        }
    </style>
</head>
<body class="h-screen flex flex-col p-6">

    <!-- CANVAS GRAPH LAYER -->
    <canvas id="networkCanvas"></canvas>
    <div id="tooltip">
        <div class="flex justify-between items-center border-b border-borderSage pb-2 mb-2">
            <span class="text-accentLime font-bold" id="tt-asset">EURUSD</span>
            <span class="text-sm" id="tt-pnl">PENDING</span>
        </div>
        <p class="text-xs text-textSecondary" id="tt-logic">AI Logic here...</p>
    </div>

    <!-- UI LAYER -->
    <div class="ui-layer flex flex-col h-full">
        <header class="flex justify-between items-center mb-6 border-b border-borderSage pb-4 shrink-0 ui-panel">
            <div>
                <h1 class="text-2xl font-bold tracking-widest textPrimary">AUTONOMOUS QUANT <span class="text-textSecondary font-normal text-sm ml-2">v2.0</span></h1>
                <p class="text-textSecondary text-xs mt-1 uppercase tracking-widest">Run ID: <span class="text-accentLime">NET-99402X</span></p>
            </div>
            <div class="text-right flex items-center gap-6">
                <!-- Status Indicator -->
                <div class="flex items-center gap-2">
                    <div id="status-dot" class="pulse-dot offline"></div>
                    <span id="status-text" class="text-textSecondary text-sm tracking-widest uppercase">System Offline</span>
                </div>
                
                <!-- Interval Dropdown -->
                <select id="interval-select" class="bg-bgSurface border border-borderSage text-textPrimary text-xs uppercase tracking-widest rounded p-2 outline-none cursor-pointer">
                    <option value="30">Every 30 Seconds</option>
                    <option value="3600">Every 1 Hour</option>
                </select>

                <!-- Start/Stop Button -->
                <button id="control-btn" class="btn-start" onclick="toggleBot()">Initialize Engine</button>
            </div>
        </header>

        <div class="flex-1 flex gap-6 min-h-0">
            <!-- Left Space for the Artificial Brain visualization -->
            <div class="flex-1 relative">
                <div class="absolute bottom-4 left-4 text-xs text-textSecondary bg-bgSurface/80 p-2 rounded border border-borderSage backdrop-blur">
                    SCROLL = ZOOM | CLICK+DRAG = PAN
                </div>
            </div>

            <!-- Right Sidebar: Stats & Feed -->
            <div class="w-96 flex flex-col gap-6 shrink-0 ui-panel">
                
                <!-- Live Equity -->
                <div class="glass-panel p-6 rounded-lg">
                    <p class="text-textSecondary text-xs uppercase tracking-widest mb-1">Live Equity</p>
                    <p class="text-3xl font-bold textPrimary glow-text" id="ui-equity">Fetching...</p>
                </div>

                <!-- AI Brain Status -->
                <div class="glass-panel p-6 rounded-lg">
                    <div class="flex justify-between items-start mb-4">
                        <p class="text-textSecondary text-xs uppercase tracking-widest">DeepSeek Engine</p>
                        <span class="bg-accentLime/20 text-accentLime text-xs px-2 py-1 rounded border border-accentLime/30" id="ui-confidence">0%</span>
                    </div>
                    <p class="text-sm textPrimary leading-relaxed" id="ui-logic">Waiting for engine initialization...</p>
                </div>

                <!-- Execution Feed -->
                <div class="glass-panel p-6 rounded-lg flex-1 flex flex-col min-h-0">
                    <p class="text-textSecondary text-xs uppercase tracking-widest mb-4">Live Execution Feed</p>
                    <div class="overflow-y-auto pr-2 space-y-3 flex-1" id="ui-feed">
                        <!-- Trades injected here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CANVAS SCRIPT -->
    <script>
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('tooltip');
        
        let width, height;
        let nodes = [];
        let edges = [];

        let scale = 1.0;
        let panX = 0;
        let panY = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            width = canvas.width;
            height = canvas.height;
        }
        window.addEventListener('resize', resize);
        resize();

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomSensitivity = 0.001;
            const delta = -e.deltaY * zoomSensitivity;
            const newScale = Math.max(0.2, Math.min(scale * (1 + delta), 5));
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;
        });

        let isDragging = false, dragStartX = 0, dragStartY = 0;
        canvas.style.cursor = 'grab';

        canvas.addEventListener('mousedown', (e) => { isDragging = true; dragStartX = e.clientX; dragStartY = e.clientY; canvas.style.cursor = 'grabbing'; });
        canvas.addEventListener('mouseup', () => { isDragging = false; canvas.style.cursor = 'grab'; });
        canvas.addEventListener('mouseleave', () => { isDragging = false; canvas.style.cursor = 'grab'; tooltip.style.opacity = 0; });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                panX += (e.clientX - dragStartX);
                panY += (e.clientY - dragStartY);
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                tooltip.style.opacity = 0;
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            let hoveredNode = null;
            for (let node of nodes) {
                const screenX = (node.x * scale) + panX;
                const screenY = (node.y * scale) + panY;
                const dx = mouseX - screenX;
                const dy = mouseY - screenY;
                if (Math.sqrt(dx*dx + dy*dy) < (node.radius * scale) + 8) { 
                    hoveredNode = node; break;
                }
            }

            if (hoveredNode) {
                document.getElementById('tt-asset').innerText = hoveredNode.data.asset;
                const pnlEl = document.getElementById('tt-pnl');
                pnlEl.innerText = hoveredNode.data.signal;
                pnlEl.style.color = hoveredNode.data.signal == "BUY" ? '#75E063' : '#ff6b6b';
                document.getElementById('tt-logic').innerText = hoveredNode.data.logic;
                tooltip.style.left = e.clientX + 'px';
                tooltip.style.top = e.clientY + 'px';
                tooltip.style.opacity = 1;
            } else {
                tooltip.style.opacity = 0;
            }
        });

        function drawNetwork() {
            ctx.clearRect(0, 0, width, height);
            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(scale, scale);

            ctx.lineWidth = 1;
            edges.forEach(edge => {
                const distance = Math.hypot(edge.from.x - edge.to.x, edge.from.y - edge.to.y);
                if (distance < 200) {
                    ctx.beginPath();
                    ctx.moveTo(edge.from.x, edge.from.y);
                    ctx.lineTo(edge.to.x, edge.to.y);
                    ctx.strokeStyle = `rgba(117, 224, 99, ${1 - (distance/200)})`;
                    ctx.stroke();
                }
            });

            nodes.forEach(node => {
                node.x += node.vx;
                node.y += node.vy;

                ctx.beginPath();
                ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
                ctx.fillStyle = node.color;
                ctx.shadowBlur = node.glow;
                ctx.shadowColor = node.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            ctx.restore();
            requestAnimationFrame(drawNetwork);
        }
        drawNetwork();

        // ----------------------------------------------------
        // BACKEND INTEGRATION & UI CONTROLS
        // ----------------------------------------------------
        let isRunning = false;
        
        async function toggleBot() {
            const interval = parseInt(document.getElementById('interval-select').value);
            isRunning = !isRunning;
            
            await fetch('/api/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: isRunning ? 'start' : 'stop', interval: interval })
            });
            
            const btn = document.getElementById('control-btn');
            if (isRunning) {
                btn.className = 'btn-stop';
                btn.innerText = 'Stop Engine';
            } else {
                btn.className = 'btn-start';
                btn.innerText = 'Initialize Engine';
            }
            pollBackend(); // immediate UI update
        }

        const assetColors = {
            "BTCUSD": "#FFE600",
            "ETHUSD": "#00FFF0",
            "XAUUSD": "#D462FF",
            "EURUSD": "#FF8C42",
            "GBPUSD": "#2DD4BF",
            "SOLUSD": "#FF1493"
        };
        
        let lastTradeCount = 0;

        async function pollBackend() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                // Update Status Indicator and Control Button
                const statusDot = document.getElementById('status-dot');
                const statusText = document.getElementById('status-text');
                const btn = document.getElementById('control-btn');
                
                isRunning = Boolean(data.is_running);
                
                if (data.is_running) {
                    statusDot.className = 'pulse-dot';
                    statusText.innerText = 'System Online';
                    statusText.className = 'text-accentLime text-sm tracking-widest uppercase';
                    if (btn) {
                        btn.className = 'btn-stop';
                        btn.innerText = 'Stop Engine';
                    }
                } else {
                    statusDot.className = 'pulse-dot offline';
                    statusText.innerText = 'System Offline';
                    statusText.className = 'text-textSecondary text-sm tracking-widest uppercase';
                    if (btn) {
                        btn.className = 'btn-start';
                        btn.innerText = 'Initialize Engine';
                    }
                }


                // Update UI Elements
                document.getElementById('ui-equity').innerText = data.equity;
                document.getElementById('ui-confidence').innerText = data.last_confidence;
                document.getElementById('ui-logic').innerText = data.last_logic;

                // Process new trades
                if (data.trade_history && data.trade_history.length > lastTradeCount) {
                    const newTradesCount = data.trade_history.length - lastTradeCount;
                    
                    for (let i = newTradesCount - 1; i >= 0; i--) {
                        const trade = data.trade_history[i];
                        
                        const feed = document.getElementById('ui-feed');
                        const isBuy = trade.signal === "BUY";
                        const tr = document.createElement('div');
                        tr.className = "flex justify-between items-center p-3 border border-borderSage rounded bg-bgDeep";
                        tr.innerHTML = `
                            <div>
                                <span class="text-xs text-textSecondary block">${trade.time}</span>
                                <span class="text-sm font-bold textPrimary">${trade.asset}</span>
                            </div>
                            <span class="${isBuy ? 'text-accentLime' : 'text-red-400'} font-bold">${trade.signal}</span>
                        `;
                        feed.insertBefore(tr, feed.firstChild);

                        let nodeColor = assetColors[trade.asset];
                        if (!nodeColor) nodeColor = isBuy ? '#75E063' : '#ff6b6b';

                        const node = {
                            x: width/2 + (Math.random()*150 - 75),
                            y: height/2 + (Math.random()*150 - 75),
                            vx: (Math.random() - 0.5) * 0.08,
                            vy: (Math.random() - 0.5) * 0.08,
                            radius: 8,
                            color: nodeColor,
                            glow: 25,
                            data: trade
                        };

                        nodes.forEach(existingNode => {
                            if (Math.random() > 0.3) {
                                edges.push({ from: node, to: existingNode });
                            }
                        });
                        nodes.push(node);
                    }
                    lastTradeCount = data.trade_history.length;
                }
            } catch (err) {
                console.error("API Error:", err);
            }
        }

        setInterval(pollBackend, 3000);
        pollBackend();
    </script>
</body>
</html>
